kind = "mobile"
previewPath = "/"
title = "Conduce DGT"
description = "Aplicación móvil de estudio para el permiso de conducir en España, con tests por temas, tests combinados y simulacros tipo DGT, explicaciones y seguimiento del progreso."
version = "1.0.0"
id = "artifacts/dgt-conduce"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19062

[services.development]
run = "pnpm --filter @workspace/dgt-conduce run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dgt-conduce", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dgt-conduce", "run", "serve" ]

[services.env]
PORT = "19062"
BASE_PATH = "/"
